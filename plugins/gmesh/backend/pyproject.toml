[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[project]
name = "sta-gmesh"
version = "1.0.0"
description = "ST Annotator Ground Mesh Plugin"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Cyrus Leung", email = "tlleungac@connect.ust.hk"},
    { name = "Maral Bahari", email = "mbahari@connect.ust.hk"},
]
keywords = [
    "computer-vision",
    "3d", "spatiotemporal", "spatio-temporal", "spatial-temporal",
    "mesh",
    "annotation", "annotation-tool",
    "labeling", "labeling-tool",
]
dependencies = ["sta", "sta-pcd", "pydantic>=2.6,<3", "pytz>=2023.3", "typing-extensions>=4.6", "numpy>=1.26", "cloth-simulation-filter", "open3d>=0.19", "fastapi[standard]>=0.115.13,<0.116", "sqlmodel>=0.0.24,<0.1", "SQLAlchemy>=2.0,<3", "click>=8.1", "tqdm>=4.23"]

[project.urls]
homepage = "https://github.com/DESRLab/st-annotator"
repository = "https://github.com/DESRLab/st-annotator"

[project.entry-points."sta.plugins"]
registry = "sta_gmesh.plugin:register"

[tool.uv.sources]
sta = { workspace = true }
sta-pcd = { workspace = true }
# This fork is "Compile for NumPy 2.3": it builds the SWIG bindings against
# numpy>=2.3, which the upstream release the fork branches from does not. The
# `do_cloth_export` binding this plugin calls is upstream code, not fork-added.
# Keep the source immutable so relocking cannot execute an unreviewed HEAD.
# [tool.uv.sources] is uv-only metadata (not PEP 621), so a wheel built from
# this file and installed from an index resolves this name to the PyPI package.
cloth-simulation-filter = { git = "https://github.com/DarkLight1337/CSF.git", rev = "4217599becc562ff57a54133632cbb21fa870441" }

[dependency-groups]
dev = ["deptry>=0.14", "ruff>=0.3", "pyright>=1.1.354", "pytest>=7.0", "pytest-cov>=3.0", "pytest-xdist>=3.5"]

[tool.deptry]
extend_exclude = ["\\.coverage/", "test", "__pycache__", "node_modules"]

[tool.deptry.per_rule_ignores]
DEP001 = ["_typeshed"]
DEP002 = ["SQLAlchemy", "typing-extensions"]

[tool.ruff]
extend = "../../../config/python/pyproject.toml"

[tool.pytest.ini_options]
addopts = "--cov=sta_gmesh --cov=sta --cov-report=term-missing --cov-report html:coverage --cov-branch --cov-context=test"
testpaths = ["test"]

[tool.coverage.html]
show_contexts = true

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol(\\[.*\\])?\\):",
    "@(abc\\.)?abstractmethod",
    "@(typing\\.)?overload",
]
