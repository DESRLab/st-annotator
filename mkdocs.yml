site_name: ST Annotator Documentation
site_description: Spatial-Temporal Annotation
site_dir: site

copyright: Copyright &copy; 2026 DESRLab

theme:
  palette: 
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  
  name: material
  logo: _static/logo.png
  favicon: _static/favicon.ico
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.sections
    - navigation.footer
    - navigation.top
    - toc.follow

docs_dir: docs

nav:
  - Home: index.md
  - Get Started:
    - Installation: install.md
    - Quickstart: quickstart.md
    - Contributing: contributing.md
    - Versioning: versioning.md
    - Roadmap: roadmap.md
    - License: license.md
  - User Guide:
    - user/index.md
    - Configuration: user/config.md
    - Hosting the ST Annotator Platform: user/host.md
    - Registering a Plugin: user/plugin.md
    - ST Annotator Platform Handbook:
      - user/handbook/index.md
      - Account Management: user/handbook/account.md
      - Data Management: user/handbook/data.md
      - Project Management: user/handbook/project.md
      - Annotation Editor: user/handbook/editor.md
  - Developer Guide:
    - dev/index.md
    - Build, Distribution, and Release: dev/build.md
    - Writing a Plugin: dev/plugin.md
    - Coding Conventions: dev/conventions.md
    - Design Docs:
      - dev/design/index.md
      - Editor State Management: dev/design/editor-state-management.md
      - Background Jobs: dev/design/background-jobs.md
      - Placeholder Values: dev/design/placeholder-values.md
  - CLI Reference: cli/index.md
  - API Reference:
    - api/index.md
    - Frontend: api/frontend/index.html    # Replaced with generated TypeDoc pages after the MkDocs build
    - Backend: api/backend/python/index.html    # Replaced with generated Sphinx pages after the MkDocs build

validation:
  nav:
    not_found: warn
  links:
    not_found: warn
    anchors: warn

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.snippets
  - pymdownx.superfences

plugins:
  - search
  - section-index
