site_name: ST Annotator Documentation
site_description: Spatial-Temporal Annotation
site_dir: site

copyright: Copyright &copy; 2023 DESRLab

theme:
  palette: 
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  
  name: material
  logo: _static/logo.png
  favicon: _static/favicon.ico
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.sections
    - navigation.footer
    - navigation.top
    - toc.follow

docs_dir: docs

nav:
  - Home: index.md
  - Get Started:
    - Installation: install.md
    - Quickstart: quickstart.md
    - Configuration: config.md
    - Contributing: contributing.md
    - Roadmap: roadmap.md
    - License: license.md
  - User Guide:
    - user/index.md
    - Hosting the ST Annotator Platform: user/host.md
    - Registering a Plugin: user/plugin.md
    - ST Annotator Platform Handbook:
      - user/handbook/index.md
      - Account Management: user/handbook/account.md
      - Data Management: user/handbook/data.md
      - Project Management: user/handbook/project.md
      - Annotation Editor: user/handbook/editor.md
  - Developer Guide:
    - dev/index.md
    - Build Pipeline: dev/build.md
    - Writing a Plugin: dev/plugin.md
    - Coding Conventions: dev/conventions.md
  - CLI Reference: cli/index.md
  - API Reference:
    - api/index.md
    - api/frontend/    # HTML pages are inserted at site_dir after the Markdown files in docs_dir are built
    - api/backend/    # HTML pages are inserted at site_dir after the Markdown files in docs_dir are built

markdown_extensions:
  - pymdownx.snippets
  - pymdownx.superfences

plugins:
  - search
  - section-index
