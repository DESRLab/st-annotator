[project]
name = "sta-integration-tests"
version = "2.0.0"
description = "Plugin-dependent backend integration tests for the ST Annotator platform"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Cyrus Leung", email = "tlleungac@connect.ust.hk"},
    { name = "Maral Bahari", email = "mbahari@connect.ust.hk"},
]
dependencies = ["sta", "sta-datasets", "sta-bbox", "sta-gmesh", "sta-pcd", "sta-segmentation", "sta-vector", "sta-relation", "fastapi>=0.115.13,<0.116", "numpy>=1.26,<2.3", "sqlmodel>=0.0.24,<0.1", "pytest>=7.0"]

# Integration tests and the with-data fixture server require the plugin backends.
# Plugins depend on sta, so these dependencies belong outside the core tests.
[tool.uv]
package = false

[tool.uv.sources]
sta = { workspace = true }
sta-datasets = { workspace = true }
sta-bbox = { workspace = true }
sta-gmesh = { workspace = true }
sta-pcd = { workspace = true }
sta-segmentation = { workspace = true }
sta-vector = { workspace = true }
sta-relation = { workspace = true }

[dependency-groups]
dev = ["deptry>=0.14", "ruff>=0.12"]

[tool.deptry]
extend_exclude = ["__pycache__"]

[tool.deptry.per_rule_ignores]
# `_typeshed` is typing-only.
DEP001 = ["_typeshed"]
# Data plugins are discovered through entry points by authorization tests and
# the fixture server. The fixture server outside this tree imports numpy.
DEP002 = ["sta-bbox", "sta-gmesh", "sta-pcd", "sta-segmentation", "sta-vector", "sta-relation", "sta-datasets", "numpy"]

[tool.ruff]
extend = "../../config/python/pyproject.toml"

[tool.pytest.ini_options]
testpaths = ["."]
markers = [
    "no_plugins: boot the test app without loading plugins through entry points; for modules that register any plugin domains they need by direct import",
]
