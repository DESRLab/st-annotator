[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "sta"
version = "5.0.0"
description = "ST Annotator Backend Library"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Cyrus Leung", email = "tlleungac@connect.ust.hk"},
    { name = "Maral Bahari", email = "mbahari@connect.ust.hk"},
]
keywords = [
    "computer-vision",
    "3d", "spatiotemporal", "spatio-temporal", "spatial-temporal",
    "annotation", "annotation-tool",
    "labeling", "labeling-tool",
]

[project.urls]
homepage = "https://github.com/DESRLab/st-annotator"
repository = "https://github.com/DESRLab/st-annotator"

[tool.poetry.scripts]
sta = "sta.cli:cli"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"

certifi = ">=2023.5"
fsspec = ">=2024.10"
python-dotenv = ">=1.0"
pydantic = "^2.6"
pydantic-extra-types = "^2.6"
pytz = ">=2023.3"
PyYAML = ">=5.3"
typing-extensions = ">=4.6"
uuid6 = ">=2024.1"

matplotlib = ">=3.4"
numpy = ">=1.26"
pandas = ">=2.2"
scipy = ">=1.12"
seaborn = ">=0.13"

fastapi = {extras = ["standard"], version = "^0.115.13"}
sqlmodel = "^0.0.24"
SQLAlchemy = "^2.0"
psycopg2-binary = "^2.9"
pyjwt = "^2.10.1"
passlib = {extras = ["argon2"], version = "^1.7.4"}
uvicorn = "^0.46.0"

click = ">=8.1"
tqdm = ">=4.23"

pytest = ">=7.0"
hypothesis = { version = ">=6.88", extras = ["zoneinfo"] }
jsoncomparison = "^1.1"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
mkdocs-material = ">=9.4"
mkdocs-section-index = ">=0.3"
sphinx = ">=6.2,<7"
sphinx-immaterial = ">=0.11"

pandas-stubs = ">=2.2"
types-jwt = "^0.1.3"
types-passlib = "^1.7.7.20260211"

deptry = ">=0.14"
ruff = ">=0.12"
pyright = ">=1.1.354"

pytest-cov = ">=3.0"
pytest-xdist = ">=3.5"

[tool.deptry]
extend_exclude = ["\\.coverage/", "docs", "test", "__pycache__", "node_modules"]

[tool.deptry.per_rule_ignores]
DEP001 = ["_typeshed"]
DEP002 = ["certifi"]
DEP003 = ["sta_bbox", "sta_segmentation"]

[tool.ruff]
extend = "../config/python/pyproject.toml"

[tool.pytest.ini_options]
addopts = "--cov=sta --cov-report=term-missing --cov-report html:coverage --cov-branch --cov-context=test"
testpaths = ["test"]

[tool.coverage.html]
show_contexts = true

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol(\\[.*\\])?\\):",
    "@(abc\\.)?abstractmethod",
    "@(typing\\.)?overload",
]
